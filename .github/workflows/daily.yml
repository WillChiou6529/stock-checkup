name: 每日資料更新

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 台灣時間週一~週五 21:30（融資融券約 21:00 公布）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 快取官方資料（歷史日期的回應不會變）
        uses: actions/cache@v4
        with:
          path: cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: 執行每日排程
        run: python -m jobs.daily
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "每日資料更新 $(date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 喚醒網站
        if: always()
        run: curl -s -m 60 https://stock-checkup.onrender.com/api/health || true
