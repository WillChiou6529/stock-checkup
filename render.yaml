services:
  - type: web
    name: stock-checkup
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    # 每日排程只會更新 data/，網站直接從 GitHub 讀最新版，不需要重新部署
    buildFilter:
      ignoredPaths:
        - data/**
        - research/**
        - .github/**
    envVars:
      - key: DATA_REMOTE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Taipei
      # 管理員登入 cookie 的簽章金鑰（Render 自動產生）
      - key: SECRET_KEY
        generateValue: true
      # 造訪紀錄的永久儲存（PostgreSQL 連線字串，例如 Neon）；沒設會存在主機上，休眠後清空
      - key: DATABASE_URL
        sync: false
